<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 4px 2px; color: #1e293b; font-size: 14px; }
    p.help { color: #64748b; margin: 0 0 14px; line-height: 1.4; }
    form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
    input { width: 100%; padding: 9px 11px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; }
    input:focus { outline: none; border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79, 70, 229, .15); }
    button { border: 0; border-radius: 8px; padding: 9px 14px; font-weight: 600; font-size: 14px; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    .primary { background: #4f46e5; color: #fff; }
    .remove { background: #fee2e2; color: #b91c1c; padding: 6px 10px; font-size: 13px; }
    h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: #64748b; margin: 0 0 8px; }
    ul { list-style: none; padding: 0; margin: 0; border: 1px solid #e2e8f0; border-radius: 10px; overflow: hidden; }
    li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-top: 1px solid #e2e8f0; }
    li:first-child { border-top: 0; }
    .who { min-width: 0; }
    .email { font-weight: 600; word-break: break-all; }
    .meta { color: #64748b; font-size: 12px; margin-top: 2px; }
    .empty { padding: 16px; text-align: center; color: #64748b; }
    #status { min-height: 20px; margin: 10px 0 0; font-size: 13px; }
    #status.error { color: #b91c1c; }
    #status.ok { color: #15803d; }
  </style>
</head>
<body>
  <p class="help">People listed here can sign in to the Taboo app with Google and add, edit or delete cards. Everyone else can still play.</p>

  <form id="addForm">
    <input id="email" type="email" placeholder="Google account email" required autocomplete="off">
    <input id="name" type="text" placeholder="Name (optional)" autocomplete="off">
    <button class="primary" id="addBtn" type="submit">Add editor</button>
  </form>

  <h3>Current editors</h3>
  <ul id="list"><li class="empty">Loading…</li></ul>
  <div id="status"></div>

  <script>
    var listEl = document.getElementById('list');
    var statusEl = document.getElementById('status');
    var form = document.getElementById('addForm');
    var addBtn = document.getElementById('addBtn');

    function setStatus(message, kind) {
      statusEl.textContent = message || '';
      statusEl.className = kind || '';
    }

    function render(editors) {
      listEl.innerHTML = '';
      if (!editors.length) {
        listEl.innerHTML = '<li class="empty">No editors yet.</li>';
        return;
      }
      editors.forEach(function(editor) {
        var li = document.createElement('li');
        var who = document.createElement('div');
        who.className = 'who';
        var email = document.createElement('div');
        email.className = 'email';
        email.textContent = editor.email;
        var meta = document.createElement('div');
        meta.className = 'meta';
        var added = editor.addedOn ? new Date(editor.addedOn).toLocaleDateString() : '';
        meta.textContent = [editor.name, added && 'added ' + added].filter(Boolean).join(' · ');
        who.appendChild(email);
        who.appendChild(meta);

        var btn = document.createElement('button');
        btn.className = 'remove';
        btn.textContent = 'Remove';
        btn.onclick = function() {
          if (!confirm('Remove ' + editor.email + ' as an editor?')) return;
          btn.disabled = true;
          setStatus('Removing…');
          google.script.run
            .withSuccessHandler(function(list) { render(list); setStatus('Removed ' + editor.email, 'ok'); })
            .withFailureHandler(function(err) { btn.disabled = false; setStatus(err.message, 'error'); })
            .adminRemoveEditor(editor.email);
        };

        li.appendChild(who);
        li.appendChild(btn);
        listEl.appendChild(li);
      });
    }

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      var email = document.getElementById('email').value;
      var name = document.getElementById('name').value;
      addBtn.disabled = true;
      setStatus('Adding…');
      google.script.run
        .withSuccessHandler(function(list) {
          addBtn.disabled = false;
          form.reset();
          render(list);
          setStatus('Added ' + email.trim().toLowerCase(), 'ok');
        })
        .withFailureHandler(function(err) { addBtn.disabled = false; setStatus(err.message, 'error'); })
        .adminAddEditor(email, name);
    });

    google.script.run
      .withSuccessHandler(render)
      .withFailureHandler(function(err) { setStatus(err.message, 'error'); })
      .adminListEditors();
  </script>
</body>
</html>
